name: release

# Publishes a release for the version in VERSION, with the tag v<VERSION>,
# NetDis.elf, a zip (ELF, README, changelog) and that version's CHANGELOG.md
# section as the notes.
#
# It runs when a change to VERSION reaches main, or by hand (Actions >
# release > Run workflow). If the release already exists it does nothing,
# so a version is never published twice.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      LLVM_CONFIG: /usr/bin/llvm-config-18
      SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must look like 1.2.3, not '$version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::notice::Release v$version already exists; nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.exists != 'true'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Install toolchain
        if: steps.version.outputs.exists != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18 wget unzip zip python3 

      - name: Install PS5 payload SDK
        if: steps.version.outputs.exists != 'true'
        run: |
          wget -q "$SDK_URL"
          sudo unzip -q -d /opt ps5-payload-sdk.zip

      - name: Test, build and package
        if: steps.version.outputs.exists != 'true'
        run: |
          make check
          make dist

      - name: Publish the release
        if: steps.version.outputs.exists != 'true'
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "NetDis v$VERSION" \
            --notes-file notes.md \
            NetDis.elf "build/NetDis-v$VERSION.zip"
